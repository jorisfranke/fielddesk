<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a24">
  <title>Fielddesk — Live Production Planner</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #78838d;
      --line: #e7e9e9;
      --paper: #fff;
      --canvas: #f5f6f4;
      --nav: #111a24;
      --nav-muted: #9aa5ae;
      --accent: #e97c4b;
      --accent-dark: #ca6033;
      --green: #2e8062;
      --green-bg: #e8f4ee;
      --amber: #ad7525;
      --amber-bg: #fbf1de;
      --red: #b94a42;
      --red-bg: #fae9e7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 246px; flex: 0 0 246px; background: var(--nav); color: #fff;
      display: flex; flex-direction: column; padding: 25px 16px 18px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 31px; }
    .brand-mark {
      width: 35px; height: 35px; border-radius: 11px; background: var(--accent);
      display: grid; place-items: center; color: #fff; font-size: 19px; font-weight: 800;
    }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.5px; }
    .brand-sub { color: #93a0aa; font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; margin-top: 2px; }
    .nav-label { color: #74818c; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; padding: 10px 11px 8px; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button {
      color: var(--nav-muted); background: transparent; border: 0; border-radius: 8px;
      display: flex; gap: 12px; align-items: center; min-height: 42px; padding: 0 11px;
      text-align: left; font-size: 13px; transition: .15s ease;
    }
    .nav button:hover { color: #fff; background: #202b37; }
    .nav button.active { background: #293541; color: #fff; box-shadow: inset 3px 0 var(--accent); }
    .nav-icon { display: grid; place-items: center; width: 19px; font-size: 16px; }
    .side-bottom { margin-top: auto; border-top: 1px solid #29333d; padding: 17px 9px 0; }
    .db-state { display: flex; align-items: center; gap: 8px; color: #b5c0c8; font-size: 11px; }
    .db-dot { width: 7px; height: 7px; border-radius: 50%; background: #62c79d; box-shadow: 0 0 0 3px #254638; }
    .side-note { color: #74818c; font-size: 10px; margin-top: 8px; line-height: 1.5; }
    .main { min-width: 0; flex: 1; }
    .topbar {
      height: 70px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 38px;
      position: sticky; top: 0; z-index: 4; backdrop-filter: blur(12px);
    }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--ink); font-weight: 650; }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .content { max-width: 1380px; margin: 0 auto; padding: 32px 38px 54px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .eyebrow { color: var(--accent-dark); font-size: 10px; font-weight: 750; letter-spacing: 1.25px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 31px); letter-spacing: -1.05px; line-height: 1.15; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 7px 0 0; }
    .button {
      border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 7px;
      min-height: 37px; padding: 0 13px; font-size: 12px; font-weight: 650; display: inline-flex;
      align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: .15s ease;
    }
    .button:hover { border-color: #c9ced0; background: #fafbfa; }
    .button.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .button.primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    .button.danger { color: var(--red); }
    .button.small { min-height: 30px; padding: 0 9px; font-size: 11px; }
    .button.icon-only { width: 31px; padding: 0; font-size: 15px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 17px 19px; }
    .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; font-weight: 600; }
    .stat-icon { width: 30px; height: 30px; border-radius: 8px; background: #fff1e9; color: var(--accent-dark); display: grid; place-items: center; font-size: 15px; }
    .stat-value { font-size: 28px; font-weight: 750; letter-spacing: -.8px; margin-top: 9px; }
    .stat-foot { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(270px, .85fr); gap: 17px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
    .panel-head { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-title { font-size: 13px; font-weight: 700; }
    .panel-caption { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .event-list { padding: 0 19px; }
    .event-row { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid #eff0ef; }
    .event-row:last-child { border-bottom: 0; }
    .date-tile { flex: 0 0 43px; height: 47px; border-radius: 8px; background: #fff2eb; display: grid; align-content: center; text-align: center; }
    .date-day { font-size: 18px; line-height: 18px; font-weight: 750; color: #9e4f2c; }
    .date-month { color: #aa755c; font-size: 9px; text-transform: uppercase; font-weight: 700; margin-top: 3px; }
    .event-info { min-width: 0; flex: 1; }
    .event-name { font-weight: 650; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-meta { color: var(--muted); font-size: 10px; margin-top: 5px; }
    .badge { display: inline-flex; align-items: center; border-radius: 20px; padding: 4px 8px; font-size: 9px; line-height: 1; font-weight: 700; white-space: nowrap; background: #eef0f1; color: #67737d; }
    .badge.Confirmed, .badge.Ready, .badge.Available, .badge.Active { background: var(--green-bg); color: var(--green); }
    .badge.Planning, .badge.Reserved, .badge.Setup { background: var(--amber-bg); color: var(--amber); }
    .badge.Completed, .badge.Inactive, .badge.Maintenance { background: #eef0f1; color: #68737d; }
    .badge.Cancelled, .badge.Issue, .badge.Damaged { background: var(--red-bg); color: var(--red); }
    .readiness { padding: 5px 19px 13px; }
    .ready-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid #eff0ef; font-size: 11px; }
    .ready-item:last-child { border-bottom: 0; }
    .ready-label { display: flex; align-items: center; gap: 9px; }
    .ready-icon { width: 24px; height: 24px; border-radius: 7px; background: #f2f4f3; color: #596672; display: grid; place-items: center; font-size: 12px; }
    .ready-count { font-weight: 700; }
    .activity-note { margin: 15px 19px 19px; border-radius: 8px; padding: 12px; background: #f8f4ef; color: #76695f; font-size: 10px; line-height: 1.5; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 9px; }
    .search-wrap { position: relative; }
    .search-wrap:before { content: "⌕"; position: absolute; left: 11px; top: 6px; color: #88939b; font-size: 18px; }
    .search { height: 37px; width: min(270px, 40vw); border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 0 11px 0 32px; outline: none; font-size: 11px; }
    .search:focus, .field:focus { border-color: #e4a181; box-shadow: 0 0 0 3px #fbeee8; }
    .select-control { height: 37px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 0 29px 0 10px; color: #47535d; font-size: 11px; outline: none; }
    .table-panel { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { height: 39px; background: #fafbfa; border-bottom: 1px solid var(--line); color: #8a949a; font-size: 9px; text-transform: uppercase; letter-spacing: .75px; font-weight: 700; padding: 0 14px; white-space: nowrap; }
    td { height: 53px; border-bottom: 1px solid #eff0ef; padding: 8px 14px; font-size: 11px; color: #46525b; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fcfcfb; }
    td:first-child { color: var(--ink); font-weight: 650; }
    .actions-cell { text-align: right; }
    .row-actions { display: flex; justify-content: flex-end; gap: 5px; }
    .empty-state { text-align: center; padding: 44px 20px; color: var(--muted); font-size: 12px; }
    .empty-symbol { color: #d3d8d8; font-size: 28px; margin-bottom: 7px; }
    .table-footer { min-height: 42px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
    .overlay { position: fixed; inset: 0; background: rgba(18,26,34,.5); z-index: 10; display: grid; place-items: center; padding: 20px; }
    .modal { width: min(590px, 100%); max-height: min(90vh, 760px); overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 24px 80px #1018204d; }
    .modal-head { padding: 20px 23px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-head h2 { font-size: 17px; margin: 0; letter-spacing: -.3px; }
    .modal-head p { color: var(--muted); font-size: 10px; margin: 5px 0 0; }
    .modal-body { padding: 18px 23px 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 14px; }
    .form-field { display: grid; gap: 6px; }
    .form-field.wide { grid-column: 1 / -1; }
    .form-field label { color: #59646c; font-size: 10px; font-weight: 650; }
    .field { width: 100%; min-height: 36px; border: 1px solid #dfe3e2; border-radius: 6px; padding: 8px 10px; outline: none; color: var(--ink); font-size: 11px; background: #fff; }
    textarea.field { min-height: 72px; resize: vertical; }
    .port-section { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 8px; padding: 13px; min-width: 0; }
    .port-section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .port-section-title { font-size: 11px; font-weight: 700; }
    .port-section-caption { color: var(--muted); font-size: 9px; margin-top: 3px; }
    .port-list { display: grid; gap: 7px; overflow-x: auto; }
    .port-labels, .port-row { min-width: 470px; display: grid; grid-template-columns: 52px minmax(120px, 1.4fr) minmax(90px, .9fr) minmax(90px, 1fr) 30px; gap: 7px; align-items: center; }
    .port-labels { color: #879199; font-size: 9px; font-weight: 650; padding: 0 2px 2px; }
    .port-row .field { min-width: 0; }
    .port-remove { width: 30px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--red); font-size: 16px; }
    .port-remove:hover { background: var(--red-bg); }
    .port-empty { color: var(--muted); font-size: 10px; padding: 4px 0 8px; }
    .metronome-grid { display: grid; grid-template-columns: 1fr minmax(260px, .72fr); gap: 17px; margin-bottom: 17px; }
    .metronome-panel { background: #17212b; color: #fff; border: 1px solid #17212b; border-radius: 10px; padding: 18px; }
    .metronome-main { display: grid; grid-template-columns: 1fr 112px; gap: 16px; align-items: center; }
    .bpm-value { font-size: 52px; line-height: 1; font-weight: 780; letter-spacing: -2px; text-align: center; }
    .bpm-label { color: #9aa6af; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; text-align: center; margin-top: 8px; }
    .bpm-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .bpm-controls .button, .metronome-actions .button { border-color: #36444f; background: #25323d; color: #fff; }
    .bpm-controls .button:hover, .metronome-actions .button:hover { background: #344350; }
    .bpm-controls input { grid-column: 1 / -1; height: 38px; border: 1px solid #36444f; border-radius: 7px; background: #0f171e; color: #fff; text-align: center; font-size: 18px; outline: none; }
    .beat-lights { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; margin: 18px 0 14px; }
    .beat-light { height: 12px; border-radius: 20px; background: #344350; transition: transform .05s, background .05s, box-shadow .05s; }
    .beat-light.active { background: var(--accent); transform: scaleY(1.7); box-shadow: 0 0 18px #e97c4b9c; }
    .beat-light.accent-active { background: #fff; box-shadow: 0 0 18px #fff8; }
    .metronome-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .metronome-actions .button.primary { border-color: var(--accent); background: var(--accent); }
    .metronome-actions .button.running { border-color: #62c79d; background: #2e8062; }
    .song-side { display: grid; gap: 12px; }
    .deck-grid-scroll { overflow-x: auto; padding: 16px; }
    .deck-grid { min-width: 700px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 9px; }
    .deck-key { min-width: 0; aspect-ratio: 1 / .9; border: 1px solid #dfe3e2; border-radius: 9px; background: #19232d; color: #fff; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; transition: transform .12s, box-shadow .12s; }
    .deck-key:hover { transform: translateY(-2px); box-shadow: 0 5px 13px #17212b24; }
    .deck-key[data-color="Red"] { background: #a94840; border-color: #a94840; }
    .deck-key[data-color="Green"] { background: #2e8062; border-color: #2e8062; }
    .deck-key[data-color="Amber"] { background: #aa7529; border-color: #aa7529; }
    .deck-key[data-color="Blue"] { background: #356a9d; border-color: #356a9d; }
    .deck-key[data-color="Purple"] { background: #705390; border-color: #705390; }
    .deck-key[data-color="White"] { background: #f0f2f1; border-color: #dfe3e2; color: var(--ink); }
    .deck-key-number { color: inherit; opacity: .7; font-size: 9px; font-weight: 700; }
    .deck-key-title { font-size: 11px; font-weight: 750; line-height: 1.2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .deck-key-action { font-size: 8px; opacity: .78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .deck-key.unmapped { background: #f9faf9; border-style: dashed; color: #9ba4a9; }
    .deck-key.unmapped .deck-key-title { font-size: 18px; font-weight: 400; align-self: center; }
    .modal-actions { padding: 14px 23px 20px; display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; z-index: 20; right: 24px; bottom: 24px; background: #17212b; color: #fff; border-radius: 8px; padding: 12px 16px; font-size: 11px; box-shadow: 0 8px 28px #14202a38; animation: appear .2s ease-out; max-width: min(360px, calc(100vw - 32px)); }
    .toast.error { background: #963c36; }
    .login-error { color: var(--red); font-size: 11px; min-height: 15px; margin: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
    [hidden] { display: none !important; }
    .access-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #111a24; padding: 20px; }
    .access-card { width: min(420px, 100%); border-radius: 12px; background: #fff; border: 1px solid #dfe3e2; box-shadow: 0 24px 80px #08101866; overflow: hidden; }
    .access-brand { padding: 23px 24px 18px; border-bottom: 1px solid var(--line); }
    .access-brand .brand-name { color: var(--ink); }
    .access-brand .brand-sub { color: var(--muted); }
    .access-form { display: grid; gap: 12px; padding: 22px 24px 24px; }
    .access-form h1 { font-size: 20px; }
    .access-form p { color: var(--muted); font-size: 12px; margin: -5px 0 4px; line-height: 1.5; }
    .access-error { min-height: 15px; margin: 0; color: var(--red); font-size: 11px; }
    @media (max-width: 900px) {
      .sidebar { width: 208px; flex-basis: 208px; }
      .topbar { padding: 0 23px; }
      .content { padding: 27px 23px 42px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .metronome-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 650px) {
      .app { display: block; }
      .sidebar { width: 100%; padding: 12px 12px 0; }
      .brand { padding: 0 5px 12px; }
      .nav-label, .side-bottom { display: none; }
      .nav { display: flex; overflow-x: auto; gap: 5px; padding-bottom: 10px; scrollbar-width: none; }
      .nav button { flex: 0 0 auto; min-height: 36px; padding: 0 10px; font-size: 11px; gap: 7px; }
      .nav button.active { box-shadow: inset 0 -2px var(--accent); }
      .nav-icon { width: auto; }
      .topbar { height: 51px; padding: 0 16px; position: static; }
      .top-actions .button:not(.primary) { display: none; }
      .content { padding: 23px 15px 36px; }
      .page-heading { align-items: flex-start; }
      .page-heading .button { margin-top: 8px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-left, .toolbar-right { width: 100%; }
      .search-wrap { flex: 1; }
      .search { width: 100%; }
    }
    @media (max-width: 420px) {
      .stats { gap: 9px; }
      .stat-card { padding: 13px; }
      .stat-value { font-size: 24px; }
      .metronome-main { grid-template-columns: 1fr 100px; }
      .bpm-value { font-size: 44px; }
      .metronome-actions { grid-template-columns: 1fr 1fr; }
      .metronome-actions #metronome-beats { grid-column: 1 / -1; }
      .form-grid { grid-template-columns: 1fr; }
      .form-field.wide { grid-column: auto; }
      .badge { font-size: 8px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><div class="brand-name">fielddesk</div><div class="brand-sub">Live production planner</div></div>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="navigation" aria-label="Main navigation"></nav>
      <div class="side-bottom">
        <div class="db-state"><span class="db-dot"></span><span id="db-label">Local database</span></div>
        <div class="side-note" id="storage-note">Your production plans are stored in this browser. Export a backup anytime.</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Workspace <span style="padding:0 6px;color:#c1c7ca">/</span> <strong id="crumb">Overview</strong></div>
        <div class="top-actions" id="top-actions">
          <button class="button" id="export-button" type="button">↥ <span>Export backup</span></button>
          <button class="button" id="import-button" type="button">↧ <span>Import</span></button>
          <input class="hidden" id="import-file" type="file" accept="application/json,.json">
          <button class="button hidden" id="editor-login-button" type="button">Log in to edit</button>
          <button class="button primary" id="top-create" type="button">＋ <span>New event</span></button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div class="access-overlay" id="access-overlay" hidden>
    <section class="access-card" role="dialog" aria-modal="true" aria-labelledby="access-title">
      <div class="access-brand"><div class="brand-mark" style="margin-bottom:10px">F</div><div class="brand-name">fielddesk</div><div class="brand-sub">Live production planner</div></div>
      <form class="access-form" id="access-form">
        <h1 id="access-title">Unlock Fielddesk</h1>
        <p id="access-copy">Enter your password to access the planner.</p>
        <div class="form-field"><label for="access-password">Password</label><input class="field" id="access-password" name="password" type="password" autocomplete="current-password" minlength="8" required></div>
        <div class="form-field hidden" id="access-confirm-wrap"><label for="access-password-confirm">Confirm password</label><input class="field" id="access-password-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8"></div>
        <p class="access-error" id="access-error"></p>
        <button class="button primary" id="access-submit" type="submit">Unlock</button>
      </form>
    </section>
  </div>
  <script>
    (() => {
      "use strict";

      const DB_NAME = "fielddesk-production-planner";
      const DB_VERSION = 2;
      const API_URL = "api.php";
      const STORE_NAMES = ["events", "cameras", "crew", "channels", "atem", "cables", "songs"];
      const navItems = [
        { id: "overview", label: "Overview", icon: "⌂" },
        { id: "events", label: "Events", icon: "▦" },

      function metronomeTick(accent = false) {
        if (metronomeAudioContext) {
          const oscillator = metronomeAudioContext.createOscillator();
          const gain = metronomeAudioContext.createGain();
          const now = metronomeAudioContext.currentTime;
          oscillator.frequency.setValueAtTime(accent ? 1200 : 850, now);
          gain.gain.setValueAtTime(accent ? 0.16 : 0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          oscillator.connect(gain);
          gain.connect(metronomeAudioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.06);
        }
        const lights = document.queryAll ? null : document.querySelectorAll(".beat-light");
        lights.forEach((light, index) => {
          light.classList.toggle("active", index === metronomeBeat);
          light.classList.toggle("accent-active", index === metronomeBeat && accent);
        });
        setTimeout(() => {
          document.querySelectorAll(".beat-light").forEach((light) => {
            light.classList.remove("active", "accent-active");
          });
        }, Math.max(70, Math.min(180, 30000 / metronomeBpm)));

      function startMetronome() {

        metronomeRunning = true;
        metronomeBeat = 0;
        metronomeTick(true);
        clearInterval(metronomeTimer);
        metronomeTimer = setInterval(() => {
          metronomeBeat = (metronomeBeat + 1) % metronomeBeats;
          metronomeTick(metronomeBeat === 0);
        }, 60000 / metronomeBpm);
        updateMetronomeControls();
      }
      function stopMetronome() {
        metronomeRunning = false;
        clearInterval(metronomeTimer);

      function tapMetronome() {
        const now = performance.now();
        tapTimes = tapTimes.filter((time) => now - time < 2200);
        tapTimes.push(now);
        if (tapTimes.length >= 2) {
          const intervals = tapTimes.slice(1).map((time, index) => time - tapTimes[index]);
          const average = intervals.reduce((sum, interval) => sum + interval, 0) / intervals.length;
          setMetronomeBpm(Math.round(60000 / average));
        }
      }

      async function exportBackup() {
        try {
          const data = { format: "fielddesk-backup", version: 1, exportedAt: new Date().toISOString(), stores: {} };
          for (const name of STORE_NAMES) data.stores[name] = await getAll(name);
          downloadFile(`fielddesk-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), "application/json");

      async function importBackup(file) {
        if (!requireEditor()) return;
        try {
          const data = JSON.parse(await file.text());
          if (data.format !== "fielddesk-backup" || !data.stores || !STORE_NAMES.every((name) => Array.isArray(data.stores[name]))) {
            throw new Error("This file is not a valid Fielddesk database backup.");
          }
          const valid = STORE_NAMES.every((name) => data.stores[name].every((record) => record && typeof record.id === "string"));
          if (!valid) throw new Error("One or more records are missing a valid ID.");
          if (!window.confirm("Import this backup? Matching IDs will be replaced; other records will be kept.")) return;
          if (serverMode) {
            await apiRequest({ action: "merge", stores: data.stores });
            serverData = await apiRequest();
          } else {
            const transaction = db.transaction(STORE_NAMES, "readwrite");
            STORE_NAMES.forEach((name) => data.stores[name].forEach((record) => transaction.objectStore(name).put(record)));
            await new Promise((resolve, reject) => {
              transaction.oncomplete = resolve;
              transaction.onerror = () => reject(transaction.error);
              transaction.onabort = () => reject(transaction.error || new Error("Import was aborted."));
            });
          }
          showToast("Backup imported successfully.");
          await render();
        } catch (error) {
          if (error.status === 401) openLoginModal();
          showToast(`Could not import backup: ${error.message}`, true);
        } finally {
          $("#import-file").value = "";
        }
      }

            : "Check the server database configuration.";
          $("#content").innerHTML = `<div class="page-heading"><div><div class="eyebrow">Database status</div><h1>${error.setup ? "Connect MySQL" : "Could not connect"}</h1><p class="subtitle">${escapeHtml(error.message)}</p></div></div>
            ${error.setup ? `<section class="panel"><div class="empty-state"><div class="empty-symbol">◆</div>Open <strong>setup.php</strong> in the deployed website folder, enter your MySQL details, test the connection, then reload this page.<br><br><button class="button primary" type="button" id="open-db-setup">Open database setup</button></div></section>` : ""}`;
          $("#open-db-setup")?.addEventListener("click", () => {
            location.href = "setup.php";
          });
        });
      } else {
        try {
          const saved = localStorage.getItem("fielddesk-local-auth");
          showAccessGate(!saved);
        } catch (error) {
          $("#db-label").textContent = "Database unavailable";
          $("#app-shell").hidden = false;
          $("#access-overlay").hidden = true;
          $("#content").innerHTML = `<div class="page-heading"><div><div class="eyebrow">Startup error</div><h1>Could not open Fielddesk</h1><p class="subtitle">${escapeHtml(error.message)}</p></div></div>`;
          showToast(error.message, true);
        }
      }
    })();
  </script>
</body>
</html>
